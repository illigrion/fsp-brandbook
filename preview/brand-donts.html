<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Don'ts" subtitle="8 правил: чего не делать со знаком" viewport="700x260" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:260px;overflow:hidden;}
.wrap{padding:14px 24px;height:100%;background:var(--paper);display:grid;grid-template-columns:repeat(4,1fr);gap:8px;}
.do{background:var(--paper-2);border:1px solid var(--cement);position:relative;display:flex;align-items:center;justify-content:center;padding:16px;aspect-ratio:1;}
.do .tag{position:absolute;top:8px;left:8px;font-size:8px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:var(--red);}
.do.ok{background:#fff;}
.do.ok .tag{color:#1F8A5B;}
.do .label{position:absolute;bottom:6px;left:8px;right:8px;font-size:8px;color:var(--graphite-500);font-weight:600;line-height:1.3;}
.lk{display:flex;align-items:center;gap:6px;}
.lk .w{display:flex;flex-direction:column;line-height:0.96;font-weight:800;font-size:7px;color:var(--graphite-700);}
.bad-gradient{background:linear-gradient(135deg,#b04 0%,#0bf 100%) !important;}
</style></head><body><div class="wrap">
<div class="do ok"><span class="tag">Можно</span><div class="lk"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#2D4F91;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Исходные пропорции</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk" style="transform:rotate(-14deg)"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#2D4F91;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Наклонять</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk" style="transform:scaleX(0.5)"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#2D4F91;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Сжимать</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#19A33C;"></span><span style="display:inline-block;width:3px;height:14px;background:#F2A93B;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#C0071A;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Чужие цвета</span></div>
<div class="do bad-gradient"><span class="tag" style="color:#fff">Нельзя</span><div class="lk"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#fff;"></span><span style="display:inline-block;width:3px;height:14px;background:#fff;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#fff;"></span></span><span class="w" style="color:#fff"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label" style="color:rgba(255,255,255,0.85)">Сложные градиенты</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk" style="filter:drop-shadow(0 4px 6px rgba(0,0,0,0.4))"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#2D4F91;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Тени, объём</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk" style="gap:18px"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span><span style="display:inline-block;width:4.5px;height:14px;background:#2D4F91;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Менять отступ</span></div>
<div class="do"><span class="tag">Нельзя</span><div class="lk"><span style="display:inline-flex;align-items:stretch;gap:1.5px;height:14px;"><span style="display:inline-block;width:3px;height:14px;background:#A8B6D5;"></span><span style="display:inline-block;width:3px;height:14px;background:#5979B5;"></span></span><span class="w"><span>FIN</span><span>STROY</span><span>PANEL</span></span></div><span class="label">Удалять брусок</span></div>
</div></body></html>
