<!doctype html>
<!-- @dsCard group="Colors" name="Colors · 60/30/8/2 Ratio" subtitle="Правило пропорций на любом макете" viewport="700x160" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:160px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;background:var(--paper-2);display:flex;flex-direction:column;justify-content:center;gap:14px;}
.bar{display:flex;height:54px;border:1px solid var(--cement);}
.bar > div{position:relative;}
.bar > div span{position:absolute;left:12px;top:50%;transform:translateY(-50%);font-size:10px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;}
.legend{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
</style></head><body><div class="wrap"><div class="legend">Правило 60 / 30 / 8 / 2</div><div class="bar"><div style="flex:60;background:var(--paper);"><span style="color:var(--graphite-500)">60% Paper</span></div><div style="flex:30;background:var(--graphite);"><span style="color:rgba(255,255,255,0.7)">30% Graphite</span></div><div style="flex:8;background:var(--navy);"><span style="color:#fff">8% Navy</span></div><div style="flex:2;background:var(--red);"></div></div><div class="legend" style="color:var(--graphite-700)">Фон · текст · акцент · сигнал</div></div></body></html>
