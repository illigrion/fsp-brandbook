<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Icon Rules" subtitle="Grid 24 · stroke 1.5 · square/miter · fill none" viewport="700x200" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:200px;overflow:hidden;}
