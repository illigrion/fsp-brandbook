<!doctype html>
<!-- @dsCard group="Type" name="Type · Display 1 / 2" subtitle="Hero и section displays" viewport="700x260" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:260px;overflow:hidden;}
.wrap{padding:18px 28px;height:100%;display:flex;flex-direction:column;justify-content:center;gap:8px;}
.row{display:grid;grid-template-columns:100px 120px 1fr;gap:16px;align-items:baseline;padding:14px 0;border-top:1px solid var(--cement);}
.row:last-child{border-bottom:1px solid var(--cement);}
.meta{font-size:10px;color:var(--graphite-500);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
.meta b{display:block;color:var(--graphite);font-weight:700;font-size:11px;margin-bottom:2px;}
.specs{font-size:10px;color:var(--graphite-500);font-feature-settings:"tnum";letter-spacing:0.04em;}
.specs b{color:var(--graphite);font-weight:700;}
.s1{font-size:54px;font-weight:900;line-height:0.92;letter-spacing:-0.035em;color:var(--graphite);}
.s2{font-size:38px;font-weight:800;line-height:0.96;letter-spacing:-0.025em;color:var(--graphite);}
</style></head><body><div class="wrap">
<div class="row"><div class="meta"><b>Display 1</b>Hero</div><div class="specs"><b>92/86</b> · w900<br/>tr −3.5%</div><div class="s1">Энерго.</div></div>
<div class="row"><div class="meta"><b>Display 2</b>Section</div><div class="specs"><b>64/60</b> · w800<br/>tr −2.5%</div><div class="s2">Сборный ж/б.</div></div>
</div></body></html>
