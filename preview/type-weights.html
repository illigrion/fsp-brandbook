<!doctype html>
<!-- @dsCard group="Type" name="Type · Weights 300–900" subtitle="Все 7 весов Montserrat" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
