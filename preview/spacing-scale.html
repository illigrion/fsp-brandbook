<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 8px Scale" subtitle="4 / 8 / 12 / 16 / 24 / 32 / 48 / 64 / 96 / 128" viewport="700x200" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:200px;overflow:hidden;}

.bars div{background:var(--navy);}
.labels{display:grid;grid-template-columns:repeat(10,1fr);gap:10px;font-size:10px;color:var(--graphite-500);font-weight:600;letter-spacing:0.04em;font-feature-settings:"tnum";text-align:center;}
.note{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
</style></head><body><div class="wrap"><div class="note">Базовый модуль 8 px · шкала отступов</div>
