<!doctype html>
<!-- @dsCard group="Components" name="Components · Stat Blocks" subtitle="Большие числа · tabular nums" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;background:var(--paper);display:flex;align-items:center;gap:36px;font-feature-settings:"tnum";font-variant-numeric:tabular-nums;}
.stat{display:flex;flex-direction:column;gap:8px;}
.stat b{font-size:60px;font-weight:900;letter-spacing:-0.04em;line-height:0.9;color:var(--graphite);}
.stat b u{text-decoration:none;font-size:20px;font-weight:700;color:var(--graphite-500);margin-left:2px;}
.stat .navy b{color:var(--navy);}
.stat .red b{color:var(--red);}
.stat span{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
</style></head><body><div class="wrap"><div class="stat"><b style="color:var(--navy)">3×</b><span>Быстрее монтажа</span></div><div class="stat"><b>120<u>мм</u></b><span>Утеплитель PIR</span></div><div class="stat"><b style="color:var(--red)">−40<u>%</u></b><span>Теплопотерь</span></div><div class="stat"><b>45<u>дн</u></b><span>В ипотеку</span></div></div></body></html>
