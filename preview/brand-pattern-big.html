<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Pattern «Уходящие панели»" subtitle="Большой паттерн на цветном фоне" viewport="700x280" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:280px;overflow:hidden;}

.col.f3 .b{background:rgba(255,255,255,0.18);}

</style></head><body><div class="wrap"><div class="col"><div class="b"></div><div class="b"></div><div class="b"></div></div><div class="col f2"><div class="b"></div><div class="b"></div><div class="b"></div></div><div class="col f3"><div class="b"></div><div class="b"></div><div class="b"></div></div><span class="lbl">«Уходящие панели» · паттерн на цветном фоне</span></div></body></html>
