<!doctype html>
<!-- @dsCard group="Components" name="Components · Form Fields" subtitle="Input · Select · Help · Focus" viewport="700x280" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:280px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;background:var(--paper);display:flex;flex-direction:column;gap:14px;justify-content:center;}
.field{display:flex;flex-direction:column;gap:5px;}
.field label{font-size:10px;font-weight:700;letter-spacing:0.12em;text-transform:uppercase;color:var(--graphite-500);}
.field input,.field select{font:inherit;font-size:14px;padding:12px 14px;border:1px solid var(--cement);background:#fff;color:var(--graphite);outline:none;border-radius:0;}
.field input:focus{border-color:var(--navy);}
.field .help{font-size:11px;color:var(--graphite-500);font-weight:500;}
.field .err{font-size:11px;color:var(--red);font-weight:600;}
.row{display:grid;grid-template-columns:1fr 1fr;gap:14px;}
</style></head><body><div class="wrap"><div class="field"><label>ФИО</label><input type="text" value="Боев Антон Сергеевич"/></div><div class="row"><div class="field"><label>Телефон</label><input type="text" style="border-color:var(--navy)" value="+7 495 123 45 67"/></div><div class="field"><label>Регион</label><select><option>Московская область</option></select></div></div><div class="field"><label>Площадь, м²</label><input type="text" value="180"/><span class="help">От 80 до 600 м²</span></div></div></body></html>
