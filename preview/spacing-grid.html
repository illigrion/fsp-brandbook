<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · 12-col Grid" subtitle="Сетка · gutter 24 · поля 80" viewport="700x240" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:240px;overflow:hidden;}
