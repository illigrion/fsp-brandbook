<!doctype html>
<!-- @dsCard group="Type" name="Type · Numerals (tabular)" subtitle="Чёрные цифры с -0.04em трекингом" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;display:flex;align-items:center;justify-content:space-around;gap:24px;font-feature-settings:"tnum";font-variant-numeric:tabular-nums;}
.stat{display:flex;flex-direction:column;gap:8px;align-items:flex-start;}
.stat b{font-size:56px;font-weight:900;letter-spacing:-0.04em;line-height:0.9;color:var(--graphite);}
.stat b em{font-style:normal;color:var(--navy);}
.stat b u{text-decoration:none;font-size:18px;font-weight:700;color:var(--graphite-500);}
.stat span{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
</style></head><body><div class="wrap">
<div class="stat"><b><em>3</em>×</b><span>Быстрее монтажа</span></div>
<div class="stat"><b>120<u>мм</u></b><span>Утеплитель</span></div>
<div class="stat"><b style="color:var(--red)">−40<u style="color:rgba(192,7,26,0.6)">%</u></b><span>Теплопотерь</span></div>
<div class="stat"><b>45<u>дн</u></b><span>В ипотеку</span></div>
</div></body></html>
