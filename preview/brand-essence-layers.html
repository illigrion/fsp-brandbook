<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Essence (3 layers)" subtitle="Несущий ж/б · утеплитель · фасад — суть знака" viewport="700x280" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:280px;overflow:hidden;}

.txt h3 em{font-style:normal;color:var(--navy);}

</style></head><body><div class="wrap"><div class="txt"><h3>Три слоя — <em>одна стена</em>.</h3><p>Несущий железобетон · теплоизоляция 120 мм · фасадный слой. Этот же принцип лежит в основе фирменного знака «III».</p></div><div class="layers"><div class="ly l1">Несущий<br/>ж/б</div><div class="ly l2">Утеп.<br/>120&nbsp;мм</div><div class="ly l3">Фасад</div></div></div></body></html>
