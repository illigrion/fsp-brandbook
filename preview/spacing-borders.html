<!doctype html>
<!-- @dsCard group="Spacing" name="Spacing · Borders" subtitle="Хайрлайны 1 px · default cement" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:22px 28px;height:100%;display:flex;flex-direction:column;gap:12px;justify-content:center;}
.note{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
.demo{display:grid;grid-template-columns:1fr 1fr 1fr;gap:14px;}
.box{height:74px;display:flex;align-items:center;justify-content:center;font-size:11px;letter-spacing:0.12em;text-transform:uppercase;color:var(--graphite-700);font-weight:700;flex-direction:column;gap:6px;background:#fff;}
.code{font-size:9px;color:var(--graphite-500);font-feature-settings:"tnum";letter-spacing:0.04em;text-transform:none;}
</style></head><body><div class="wrap"><div class="note">Бордеры — хайрлайны 1 px</div><div class="demo"><div class="box" style="border:1px solid var(--cement);">Default<span class="code">1px solid #C9C8C3</span></div><div class="box" style="border:1px solid var(--graphite);">Heavy<span class="code">1px solid #2A2A2D</span></div><div class="box" style="background:var(--graphite);color:#fff;border:1px solid rgba(255,255,255,0.15);">On dark<span class="code" style="color:var(--graphite-300)">1px solid #1a1a1c</span></div></div><div class="note" style="color:var(--graphite-700)">Hairlines делят секции и обрамляют все карточки. Никаких теней в статике.</div></div></body></html>
