<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Cover" subtitle="Обложка брендбука — title + stripes + badges" viewport="700x340" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:340px;overflow:hidden;}
.wrap{padding:24px 32px;height:100%;background:linear-gradient(180deg,var(--paper) 0%,var(--paper) 60%,var(--paper-2) 100%);display:flex;flex-direction:column;justify-content:space-between;position:relative;overflow:hidden;}
.top{display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.2em;text-transform:uppercase;color:var(--graphite-500);font-weight:600;}
.title{font-size:84px;font-weight:900;line-height:0.86;letter-spacing:-0.04em;color:var(--graphite);}
.title em{font-style:normal;color:var(--navy);}
.reg{font-size:0.18em;vertical-align:top;font-weight:600;color:var(--graphite-500);margin-left:6px;}
.line{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;border-top:1px solid var(--graphite);padding-top:12px;font-size:9px;letter-spacing:0.16em;text-transform:uppercase;font-weight:700;color:var(--graphite-700);}
.line small{display:block;color:var(--graphite-500);font-weight:400;letter-spacing:0.1em;font-size:9px;margin-top:4px;}
.stripes{position:absolute;right:32px;top:50px;display:flex;align-items:stretch;gap:13px;height:200px;}
.stripes .b{display:inline-block;height:200px;}
.stripes .b:nth-child(1){width:26px;background:var(--bar-light);}
.stripes .b:nth-child(2){width:26px;background:var(--bar-mid);}
.stripes .b:nth-child(3){width:39px;background:var(--bar-dark);}
.badge{display:inline-flex;gap:7px;align-items:center;padding:5px 11px;background:var(--red);color:#fff;font-size:9px;font-weight:700;letter-spacing:0.16em;text-transform:uppercase;width:fit-content;}
</style></head><body><div class="wrap"><div class="stripes"><div class="b"></div><div class="b"></div><div class="b"></div></div><div class="top"><span>FSP · ФСП · 2026</span><span>Brand Book · v1.0</span></div><div><span class="badge">Дизайн-система · v1.0</span><div class="title" style="margin-top:14px">Дизайн-<br/>система<em>.</em><span class="reg">®</span></div></div><div class="line"><div>Логотип<small>RU/EN · моно</small></div><div>Палитра<small>Navy · Graphite · Red</small></div><div>Шрифт<small>Montserrat</small></div><div>Применения<small>Бланки · мерч · авто</small></div></div></div></body></html>
