<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Pattern «Эквалайзер»" subtitle="Лента из брусков для разделителей" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}

.bars > div{}
