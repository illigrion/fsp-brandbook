<!doctype html>
<!-- @dsCard group="Components" name="Components · Badges" subtitle="Outlined и solid, navy/red/muted" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;background:var(--paper);display:flex;flex-direction:column;gap:14px;justify-content:center;}
.note{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center;}
.badge{display:inline-flex;align-items:center;gap:7px;padding:5px 11px;font-size:10px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;border:1px solid currentColor;color:var(--navy);}
.badge.solid{background:var(--navy);color:#fff;border-color:var(--navy);}
.badge.red{color:var(--red);}
.badge.red.solid{background:var(--red);color:#fff;border-color:var(--red);}
.badge.muted{color:var(--graphite-500);border-color:var(--graphite-300);}
.badge.green{color:#1F8A5B;}
.dot{width:6px;height:6px;background:currentColor;display:inline-block;}
</style></head><body><div class="wrap"><div class="note">Outlined</div><div class="row"><span class="badge"><span class="dot"></span>В производстве</span><span class="badge">Серия КП-3</span><span class="badge red"><span class="dot"></span>Срочно</span><span class="badge green"><span class="dot"></span>Готово</span><span class="badge muted">Архив</span></div><div class="note">Solid</div><div class="row"><span class="badge solid">Готово к монтажу</span><span class="badge red solid">Сертифицировано</span><span class="badge solid" style="background:var(--graphite);border-color:var(--graphite)">Под ключ</span></div></div></body></html>
