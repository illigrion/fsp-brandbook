<!doctype html>
<!-- @dsCard group="Components" name="Components · Project Card" subtitle="Карточка с фото, бейджем и спецификацией" viewport="700x360" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:360px;overflow:hidden;}
.wrap{padding:18px 24px;height:100%;background:var(--paper-2);display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:center;}
.card{background:#fff;border:1px solid var(--cement);display:flex;flex-direction:column;}
.ph{aspect-ratio:4/3;background:var(--concrete);overflow:hidden;position:relative;display:flex;align-items:flex-end;padding:12px;}
.ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
.badge{position:relative;z-index:2;padding:4px 9px;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;background:rgba(255,255,255,0.95);color:var(--graphite);}
.body{padding:14px 16px 16px;display:flex;flex-direction:column;gap:10px;}
.meta{display:flex;justify-content:space-between;font-size:9px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:600;}
.body h3{margin:0;font-size:16px;font-weight:800;line-height:1.1;letter-spacing:-0.015em;color:var(--graphite);}
.specs{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;padding-top:8px;border-top:1px solid var(--cement);}
.specs div{display:flex;flex-direction:column;gap:1px;}
.specs b{font-size:13px;font-weight:700;color:var(--graphite);font-feature-settings:"tnum";}
.specs b em{font-style:normal;color:var(--navy);}
.specs span{font-size:8px;letter-spacing:0.16em;text-transform:uppercase;color:var(--graphite-500);font-weight:600;}
</style></head><body><div class="wrap"><div class="card"><div class="ph"><img src="../assets/project_01.jpeg" alt=""/><span style="position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:stretch;gap:1.5px;height:18px;"><span style="display:inline-block;width:4px;height:18px;background:rgba(255,255,255,0.7);box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span><span style="display:inline-block;width:4px;height:18px;background:rgba(255,255,255,0.85);box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span><span style="display:inline-block;width:6px;height:18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span></span><span class="badge">Готово</span></div><div class="body"><div class="meta"><span>2 этажа</span><span>Истра</span></div><h3>Дом «Север-180»</h3><div class="specs"><div><b>180<em> м²</em></b><span>Площадь</span></div><div><b>14<em> дн</em></b><span>Монтаж</span></div><div><b>320<em> мм</em></b><span>Стена</span></div></div></div></div><div class="card"><div class="ph"><img src="../assets/project_02.jpeg" alt=""/><span style="position:absolute;top:10px;left:10px;z-index:2;display:inline-flex;align-items:stretch;gap:1.5px;height:18px;"><span style="display:inline-block;width:4px;height:18px;background:rgba(255,255,255,0.7);box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span><span style="display:inline-block;width:4px;height:18px;background:rgba(255,255,255,0.85);box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span><span style="display:inline-block;width:6px;height:18px;background:#fff;box-shadow:0 1px 4px rgba(0,0,0,0.2);"></span></span><span class="badge" style="background:var(--red);color:#fff">В производстве</span></div><div class="body"><div class="meta"><span>4 секции</span><span>Подольск</span></div><h3>Таун-хаус «Кладово»</h3><div class="specs"><div><b>640<em> м²</em></b><span>Площадь</span></div><div><b>А++</b><span>Класс</span></div><div><b>28<em> дн</em></b><span>Завод</span></div></div></div></div></div></body></html>
