<!doctype html>
<!-- @dsCard group="Components" name="Components · Buttons" subtitle="Primary / Secondary / Ghost / Danger · base + sm" viewport="700x240" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:240px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;display:flex;flex-direction:column;gap:18px;justify-content:center;background:var(--paper);}
.row{display:flex;gap:14px;align-items:center;flex-wrap:wrap;}
.note{font-size:10px;letter-spacing:0.18em;text-transform:uppercase;color:var(--graphite-500);font-weight:700;}

.btn{display:inline-flex;align-items:center;gap:10px;padding:14px 22px;font-size:12px;font-weight:700;letter-spacing:0.14em;text-transform:uppercase;background:var(--navy);color:#fff;border:1px solid var(--navy);cursor:pointer;font-family:inherit;}
.btn:hover{background:var(--navy-deep);}
.btn.secondary{background:transparent;color:var(--navy);}
.btn.secondary:hover{background:var(--navy-50);}
.btn.ghost{background:transparent;color:var(--graphite);border-color:var(--graphite);}
.btn.ghost:hover{background:var(--graphite);color:#fff;}
.btn.danger{background:var(--red);border-color:var(--red);}
.btn.sm{padding:9px 14px;font-size:10px;}
.btn .arrow{width:14px;height:1px;background:currentColor;position:relative;}
.btn .arrow::after{content:"";position:absolute;right:0;top:-3px;width:6px;height:6px;border-top:1px solid currentColor;border-right:1px solid currentColor;transform:rotate(45deg);}

</style></head><body><div class="wrap"><div class="note">Кнопки — base size</div><div class="row"><button class="btn">Заказать панель <span class="arrow"></span></button><button class="btn secondary">Каталог проектов</button><button class="btn ghost">Скачать · PDF</button><button class="btn danger">Срочно</button></div><div class="note">Small · sm</div><div class="row"><button class="btn sm">Primary</button><button class="btn sm secondary">Secondary</button><button class="btn sm ghost">Ghost</button></div></div></body></html>
