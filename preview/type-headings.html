<!doctype html>
<!-- @dsCard group="Type" name="Type · H1 / H2 / H3" subtitle="Иерархия заголовков" viewport="700x280" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:280px;overflow:hidden;}
.wrap{padding:18px 28px;height:100%;display:flex;flex-direction:column;justify-content:center;}
.row{display:grid;grid-template-columns:100px 120px 1fr;gap:16px;align-items:baseline;padding:12px 0;border-top:1px solid var(--cement);}
.row:last-child{border-bottom:1px solid var(--cement);}
.meta{font-size:10px;color:var(--graphite-500);letter-spacing:0.08em;text-transform:uppercase;font-weight:500;}
.meta b{display:block;color:var(--graphite);font-weight:700;font-size:11px;margin-bottom:2px;}
.specs{font-size:10px;color:var(--graphite-500);font-feature-settings:"tnum";letter-spacing:0.04em;}
.specs b{color:var(--graphite);font-weight:700;}
.h1{font-size:36px;font-weight:800;line-height:1.04;letter-spacing:-0.02em;color:var(--graphite);}
.h2{font-size:26px;font-weight:700;line-height:1.1;letter-spacing:-0.015em;color:var(--graphite);}
.h3{font-size:18px;font-weight:700;line-height:1.2;letter-spacing:-0.005em;color:var(--graphite);}
</style></head><body><div class="wrap">
<div class="row"><div class="meta"><b>H1</b>Section</div><div class="specs"><b>44/46</b> · w800</div><div class="h1">Дома без компромиссов</div></div>
<div class="row"><div class="meta"><b>H2</b>Sub-section</div><div class="specs"><b>32/36</b> · w700</div><div class="h2">Трёхслойная панель</div></div>
<div class="row"><div class="meta"><b>H3</b>Card</div><div class="specs"><b>22/28</b> · w700</div><div class="h3">Заводское качество, монтаж под ключ</div></div>
</div></body></html>
