<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Applications" subtitle="Визитка · спецодежда · авто" viewport="700x280" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:280px;overflow:hidden;}
