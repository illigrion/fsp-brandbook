<!doctype html>
<!-- @dsCard group="Type" name="Type · Caption / Eyebrow / Tabular" subtitle="Метки · надписи · числа" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:24px 28px;height:100%;display:flex;flex-direction:column;gap:22px;justify-content:center;}
.unit{display:grid;grid-template-columns:130px 1fr;gap:24px;align-items:baseline;padding-bottom:18px;border-bottom:1px solid var(--cement);}
.unit:last-child{border:0;}
.label{font-size:10px;letter-spacing:0.08em;text-transform:uppercase;color:var(--graphite-500);font-weight:500;}
.label b{display:block;color:var(--graphite);font-weight:700;font-size:11px;margin-bottom:2px;}
.cap{font-size:12px;font-weight:500;letter-spacing:0.12em;text-transform:uppercase;color:var(--graphite);}
.kicker{font-size:12px;font-weight:700;letter-spacing:0.20em;text-transform:uppercase;color:var(--navy);}
.tnum{font-size:14px;font-weight:600;font-feature-settings:"tnum";font-variant-numeric:tabular-nums;color:var(--graphite);letter-spacing:0.02em;}
</style></head><body><div class="wrap">
<div class="unit"><div class="label"><b>Caption</b>12 px · w500</div><div class="cap">Серия КП-3 · 2026 · ГОСТ 31310</div></div>
<div class="unit"><div class="label"><b>Eyebrow</b>12 px · w700 · navy</div><div class="kicker">Цветовая система</div></div>
<div class="unit"><div class="label"><b>Tabular nums</b>16 px · tnum</div><div class="tnum">+7 495 123 45 67 · 180 м² · 47 дней</div></div>
</div></body></html>
