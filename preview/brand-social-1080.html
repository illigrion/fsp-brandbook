<!doctype html>
<!-- @dsCard group="Brand" name="Brand · Social 1080×1080" subtitle="4 поста: navy / paper / red / graphite" viewport="700x260" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:260px;overflow:hidden;}

.p2 .sub{color:var(--graphite-500);}
</style></head><body><div class="wrap">
