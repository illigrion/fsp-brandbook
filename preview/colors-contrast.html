<!doctype html>
<!-- @dsCard group="Colors" name="Colors · Contrast pairs" subtitle="WCAG AAA/AA · доступность" viewport="700x220" --><html lang="ru"><head><meta charset="utf-8"/><meta name="viewport" content="width=700"/><link rel="stylesheet" href="card.css"/><style>body{height:220px;overflow:hidden;}
.wrap{padding:20px 28px;height:100%;display:flex;flex-direction:column;gap:0;justify-content:center;}
.row{display:grid;grid-template-columns:1fr 80px 70px;gap:16px;align-items:center;padding:11px 0;border-top:1px solid var(--cement);font-size:12px;}
.row:last-child{border-bottom:1px solid var(--cement);}
.swp{display:flex;height:24px;}
.swp .a, .swp .b{flex:1;display:flex;align-items:center;padding:0 10px;font-size:11px;font-weight:700;}
.ratio{font-size:13px;font-weight:700;font-feature-settings:"tnum";color:var(--graphite);text-align:right;}
.grade{font-size:9px;letter-spacing:0.18em;text-transform:uppercase;font-weight:700;color:var(--navy);text-align:right;}
</style></head><body><div class="wrap">
<div class="row"><div class="swp"><div class="a" style="background:var(--navy);color:#fff">Navy</div><div class="b" style="background:#fff;color:var(--navy)">White</div></div><div class="ratio">7.8 : 1</div><div class="grade">AAA</div></div>
<div class="row"><div class="swp"><div class="a" style="background:var(--graphite);color:#fff">Graphite</div><div class="b" style="background:#fff;color:var(--graphite)">White</div></div><div class="ratio">15.4 : 1</div><div class="grade">AAA</div></div>
<div class="row"><div class="swp"><div class="a" style="background:var(--navy);color:#fff">Navy</div><div class="b" style="background:var(--paper);color:var(--navy)">Paper</div></div><div class="ratio">7.5 : 1</div><div class="grade">AAA</div></div>
<div class="row"><div class="swp"><div class="a" style="background:var(--red);color:#fff">Red</div><div class="b" style="background:#fff;color:var(--red)">White</div></div><div class="ratio">6.4 : 1</div><div class="grade">AA·L</div></div>
<div class="row"><div class="swp"><div class="a" style="background:var(--navy);color:#fff">Navy</div><div class="b" style="background:var(--navy-100);color:var(--navy)">Navy 100</div></div><div class="ratio">5.9 : 1</div><div class="grade">AA</div></div>
</div></body></html>
